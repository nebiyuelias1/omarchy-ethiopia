name: Update theme competition votes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: theme-votes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check competition window
        id: window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff="2026-11-02"
          today="$(TZ=Africa/Addis_Ababa date +%F)"
          if [[ ! "$today" < "$cutoff" ]]; then
            echo "Competition is over ($today >= $cutoff). Disabling scheduled vote updates."
            gh workflow disable "Update theme competition votes" -R "$GITHUB_REPOSITORY" || true
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "Voting window open ($today < $cutoff)."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Refresh vote counts
        if: steps.window.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/update_theme_votes.py

      - name: Refresh judge scores
        if: steps.window.outputs.active == 'true'
        env:
          JUDGE_SHEET_CSV_URL: ${{ vars.JUDGE_SHEET_CSV_URL }}
          JUDGE_SHEET_CSV_URLS: ${{ vars.JUDGE_SHEET_CSV_URLS }}
        run: python3 scripts/update_theme_scores.py

      - name: Commit changes
        id: commit
        if: steps.window.outputs.active == 'true'
        run: |
          if git diff --quiet -- data/theme-votes.json data/theme-scores.json; then
            echo "No vote or score changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/theme-votes.json data/theme-scores.json
          git commit -m "chore: update theme competition standings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: steps.window.outputs.active == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml -R "$GITHUB_REPOSITORY"
